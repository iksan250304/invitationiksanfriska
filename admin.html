<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Undangan</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css?v=13"></head><body>
<div id="toast" role="status"></div>

<main id="login" class="login">
  <form id="loginForm" class="card">
    <h1>Panel Admin</h1><p class="muted" id="loginInfo"></p>
    <div id="loginFields"></div>
    <button class="btn primary block" type="submit">Masuk</button>
    <p id="err" role="alert"></p>
  </form>
</main>

<div id="app" hidden>
  <header class="top">
    <div class="brand"><h1>Admin Undangan</h1><span class="chip" id="modeChip"></span></div>
    <div class="row"><a class="btn" href="index.html" target="_blank" rel="noopener">Pratinjau</a><button class="btn ghost" id="logout" type="button">Keluar</button></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Menu admin"></nav>
  <div id="errbar" class="errbar" role="alert" hidden></div>
  <section id="panel" class="wrap"></section>
  <div class="savebar" id="savebar" hidden>
    <span>Ada perubahan yang belum disimpan.</span>
    <button class="btn" id="discard" type="button">Batalkan</button><button class="btn primary" id="save" type="button">Simpan</button>
  </div>
</div>

<script src="js/config.js?v=13"></script><script src="js/store.js?v=13"></script><script src="js/admin.js?v=13"></script>
</body></html>
